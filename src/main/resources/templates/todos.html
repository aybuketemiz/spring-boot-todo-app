<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todos - Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .todo-item {
            transition: all 0.3s ease;
        }
        .todo-item:hover {
            background-color: #f8f9fa;
        }
        .completed-todo {
            opacity: 0.7;
        }
        .completed-todo .todo-title {
            text-decoration: line-through;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-tasks"></i> Todo App
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-white me-3">
                    <i class="fas fa-user"></i> <span th:text="${username}"></span>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Success/Error Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Statistics Cards -->
        <div class="row mb-4">
            <div class="col-md-4 mb-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="fas fa-list"></i> Total Todos
                        </h5>
                        <h2 class="card-text" th:text="${totalCount}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="fas fa-check-circle"></i> Completed
                        </h5>
                        <h2 class="card-text" th:text="${completedCount}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="fas fa-clock"></i> Incomplete
                        </h5>
                        <h2 class="card-text" th:text="${incompleteCount}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Add Todo Form -->
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-plus-circle"></i> Add New Todo
                        </h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/todos}" th:object="${newTodo}" method="post">
                            <div class="mb-3">
                                <label for="title" class="form-label">Title *</label>
                                <input type="text" class="form-control" 
                                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                                       id="title" th:field="*{title}" 
                                       placeholder="Enter todo title" required>
                                <div th:if="${#fields.hasErrors('title')}" class="invalid-feedback">
                                    <span th:errors="*{title}"></span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" 
                                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                          id="description" th:field="*{description}" 
                                          rows="3" placeholder="Enter description (optional)"></textarea>
                                <div th:if="${#fields.hasErrors('description')}" class="invalid-feedback">
                                    <span th:errors="*{description}"></span>
                                </div>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-plus"></i> Add Todo
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Todo List -->
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">
                                <i class="fas fa-list-ul"></i> My Todos
                            </h5>
                            <div class="btn-group btn-group-sm" role="group">
                                <a th:href="@{/todos}" 
                                   th:classappend="${currentFilter == null} ? 'active' : ''"
                                   class="btn btn-outline-primary">All</a>
                                <a th:href="@{/todos(filter='incomplete')}" 
                                   th:classappend="${currentFilter == 'incomplete'} ? 'active' : ''"
                                   class="btn btn-outline-warning">Incomplete</a>
                                <a th:href="@{/todos(filter='completed')}" 
                                   th:classappend="${currentFilter == 'completed'} ? 'active' : ''"
                                   class="btn btn-outline-success">Completed</a>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div th:if="${#lists.isEmpty(todos)}" class="text-center p-5">
                            <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                            <p class="text-muted">No todos found. Add one to get started!</p>
                        </div>
                        
                        <ul class="list-group list-group-flush">
                            <li th:each="todo : ${todos}" 
                                th:classappend="${todo.completed} ? 'completed-todo' : ''"
                                class="list-group-item todo-item">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div class="flex-grow-1">
                                        <h6 class="mb-1 todo-title" th:text="${todo.title}">Todo Title</h6>
                                        <p class="mb-1 text-muted small" th:if="${todo.description}" 
                                           th:text="${todo.description}">Description</p>
                                        <small class="text-muted">
                                            <i class="fas fa-calendar-alt"></i>
                                            <span th:text="${#temporals.format(todo.createdDate, 'dd MMM yyyy HH:mm')}"></span>
                                        </small>
                                    </div>
                                    <div class="btn-group btn-group-sm ms-2" role="group">
                                        <form th:action="@{/todos/{id}/toggle(id=${todo.id})}" method="post" class="d-inline">
                                            <button type="submit" 
                                                    th:classappend="${todo.completed} ? 'btn-success' : 'btn-outline-success'"
                                                    class="btn" 
                                                    th:title="${todo.completed} ? 'Mark as incomplete' : 'Mark as complete'">
                                                <i class="fas fa-check"></i>
                                            </button>
                                        </form>
                                        <a th:href="@{/todos/{id}/edit(id=${todo.id})}" 
                                           class="btn btn-outline-primary"
                                           title="Edit">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-outline-danger" 
                                                    onclick="return confirm('Are you sure you want to delete this todo?')"
                                                    title="Delete">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
